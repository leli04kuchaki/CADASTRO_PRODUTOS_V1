<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>

        
        <form id="produto-form">
            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" placeholder="Ex. Notebook" required />
            </div>

            <div class="form-group">
                <label for="nome">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" placeholder="Ex. 3500.00" required />
            </div>

            <div class="form-group">
                <label for="nome">Quantidade:</label>
                <input type="number" id="quantidade" placeholder="Ex. 10" required />
            </div>

            <button type="submit" class="btn-primary">Adicionar Produto</button>
        </form>

 
         <div class="resumo do container">
            <h3 id="total do estoque">Total em Estoque: R$0,00</h3>
            <button id="limpar a tabela" class="btn-danger">Limpar Tudo</button>
         </div>


          <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
          </table>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
